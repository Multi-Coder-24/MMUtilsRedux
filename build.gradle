plugins {
    id 'java'
    id 'application'
    id 'com.gradleup.shadow' version '9.6.1'
}

group = 'org.multicoder'
version = '1.0.0'

repositories {
    mavenCentral()
}

dependencies {
    shadow(implementation("org.apache.logging.log4j:log4j-core:2.26.0"))
}

application{
    mainClass = "org.multicoder.mmutils.Main"

}